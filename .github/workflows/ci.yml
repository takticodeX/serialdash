name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # M0+M1 scope (SPEC.md §11, §9.4): lint, schema/type generation alignment, protocol test
  # vectors, app unit tests + build, and the docs site build. E2e against the simulator, native
  # library tests, example compilation, and the size report are wired in as that code lands
  # (M2, M3, M6).
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Typecheck app
        run: npx tsc -p app/tsconfig.json

      - name: Typecheck tools
        run: |
          npx tsc -p tools/gen-types/tsconfig.json
          npx tsc -p tools/validate-vectors/tsconfig.json

      - name: Unit tests (protocol test vectors + app)
        run: npm test

      - name: Generated types/docs stay aligned with the schema (PRO-02, DOC-03)
        run: npm run gen:check

      - name: Build app
        run: npm run build -w app

      - name: Build documentation site
        run: npm run docs:build
