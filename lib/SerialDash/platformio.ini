; PlatformIO project file for SerialDash's own native unit tests
; (SPEC.md §9.2 QA-10). Run with `pio test -e native -d lib/SerialDash`
; (see the root CLAUDE.md command table).
;
; The `native` platform is plain host GCC/Clang with no Arduino framework at
; all, so `test/native_support/Arduino.h` stands in for just the handful of
; Arduino conventions SerialDash's source depends on (Stream/Print, F(),
; pgm_read_byte) — see that file for why this is a deliberately tiny,
; dependency-free shim rather than a third-party Arduino mock.

[env:native]
platform = native
test_build_src = yes
build_flags =
    -std=c++11
    -Wall
    -Wextra
    -I test/native_support
